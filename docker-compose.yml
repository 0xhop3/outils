services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: outils
      POSTGRES_PASSWORD: outils
      POSTGRES_DB: outils
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "outils"]
      interval: 2s
      timeout: 5s
      retries: 10
  api:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://outils:outils@postgres:5432/outils?sslmode=disable"
      FIREBASE_CREDENTIALS_FILE: "/outils/firebase-credentials.json"
    volumes:
      - ./firebase-credentials.json:/outils/firebase-credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres_data:
